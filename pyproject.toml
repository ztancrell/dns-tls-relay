[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "dns-tls-relay"
version = "1.0.0"
description = "Privacy proxy to convert DNS:UDP to DNS-over-TLS with local record caching"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "DOWRIGHT", email = ""},
]
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
dns-tls-relay = "run_relay:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
